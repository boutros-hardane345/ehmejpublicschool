<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Login — Teacher & Student</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <h1>School Login</h1>
  <p class="subtitle">Teacher: email &nbsp;•&nbsp; Student: username on paper (eb7 / eb8 / eb9)</p>
  <div class="login-error" id="loginError"></div>
  <form id="loginForm">
    <div class="form-group">
      <label for="identifier">Username or Email</label>
      <input type="text" id="identifier" placeholder="teacher@example.com or eb7-first-last" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:.4rem">
      <input type="checkbox" id="showPass" style="width:auto">
      <label for="showPass" style="margin:0;font-weight:400">Show password</label>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
  </form>
</div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
