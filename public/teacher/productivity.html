<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Productivity — Math Teacher Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>document.documentElement.setAttribute('data-season',['winter','winter','spring','spring','spring','summer','summer','summer','fall','fall','fall','winter'][new Date().getMonth()])</script>
</head>
<body>
<div class="sidebar-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Math Teacher Dashboard</h1>
      <small>Single-teacher classroom platform</small>
    </div>
    <nav class="sidebar-nav">
      <a href="/teacher/dashboard" style="--i:1">Dashboard</a>
      <a href="/teacher/students" style="--i:2">Students</a>
      <a href="/teacher/content" style="--i:3">Content</a>
      <a href="/teacher/grades" style="--i:4">Grades</a>
      <a href="/teacher/year-results" style="--i:5">Year Results</a>
      <a href="/teacher/productivity" style="--i:6">Productivity</a><a href="/teacher/logins" style="--i:7">Logins</a>
      <a href="/logout" class="logout" style="--i:7">Logout</a>
    </nav>
    <div class="sidebar-footer">
      <em id="sideQuote">Loading...</em>
    </div>
  </aside>
  <div class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>
  <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>

  <main class="main-content">
    <div class="container stagger">
      <div class="page-header">
        <p class="eyebrow">Tools & Utilities</p>
        <h1>Productivity</h1>
        <p>Pick names and form groups from your class.</p>
      </div>

      <div class="split-layout">
        <div class="card tool-card">
          <div class="section-heading">
            <h2><i class="fas fa-dice"></i> Name Picker</h2>
          </div>
          <div style="margin:1rem 0">
            <select id="pickerClass" style="width:100%;padding:8px;margin-bottom:8px">
              <option value="Grade 7">Grade 7</option><option value="Grade 8">Grade 8</option><option value="Grade 9">Grade 9</option>
            </select>
            <select id="pickerYear" style="width:100%;padding:8px;margin-bottom:1rem">
              <option value="2026-2027">2026-2027</option><option value="2025-2026">2025-2026</option>
            </select>
          </div>
          <div class="picker-display">
            <div class="result" id="teacherPickerResult">Ready</div>
          </div>
          <div class="picker-display" style="margin-top:.5rem">
            <div id="teacherPickerPool" style="display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem"></div>
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:1rem">
            <button class="btn btn-primary" onclick="pickName()"><i class="fas fa-dice"></i> Pick One</button>
            <button class="btn btn-secondary" onclick="initNamePicker()">Load</button>
            <button class="btn btn-secondary" onclick="resetPicker()">Reset</button>
          </div>
        </div>

        <div class="card tool-card">
          <div class="section-heading">
            <h2><i class="fas fa-users"></i> Group Generator</h2>
          </div>
          <div style="margin:1rem 0">
            <select id="groupClass" style="width:100%;padding:8px;margin-bottom:8px">
              <option value="Grade 7">Grade 7</option><option value="Grade 8" selected>Grade 8</option><option value="Grade 9">Grade 9</option>
            </select>
            <select id="groupYear" style="width:100%;padding:8px;margin-bottom:1rem">
              <option value="">Loading years...</option>
            </select>
          </div>
          <input type="number" id="groupSize" min="1" max="10" value="3" style="width:100%;padding:8px;margin-bottom:1rem">
          <button class="btn btn-primary" onclick="initGroupGenerator()"><i class="fas fa-shuffle"></i> Generate Groups</button>
          <div id="teacherGroupsContainer"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/teacher-productivity.js"></script>
</body>
</html>
