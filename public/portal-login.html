<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login — Math Class Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <h1>Student Login</h1>
  <p class="subtitle">Use the username and password on your paper</p>
  <div class="login-error" id="loginError"></div>
  <form id="portalLoginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="eb7-first-last" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>
</div>
<script>
document.getElementById('portalLoginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginError');
  try {
    const r = await fetch('/portal/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    if (r.ok) {
      const data = await r.json();
      const slug = data.className.toLowerCase().replace(' ', '-');
      window.location.href = '/portal/' + slug;
    } else {
      const data = await r.json();
      errEl.textContent = data.error || 'Invalid credentials';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = 'Connection error';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
