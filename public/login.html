<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <h1>Login</h1>
  <p class="subtitle">Enter your username or email and password</p>
  <div class="login-error" id="loginError"></div>
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="identifier">Username or Email</label>
      <input type="text" id="identifier" placeholder="" autocomplete="off" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
  </form>
</div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
