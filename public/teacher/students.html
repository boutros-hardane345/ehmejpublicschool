<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Students — Math Teacher Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<script>document.documentElement.setAttribute('data-season',['winter','winter','spring','spring','spring','summer','summer','summer','fall','fall','fall','winter'][new Date().getMonth()])</script>
</head>
<body>
<div class="sidebar-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Math Teacher Dashboard</h1>
      <small>Single-teacher classroom platform</small>
    </div>
    <nav class="sidebar-nav">
      <a href="/teacher/dashboard" style="--i:1">Dashboard</a>
      <a href="/teacher/students" class="active" style="--i:2">Students</a>
      <a href="/teacher/content" style="--i:3">Content</a>
      <a href="/teacher/grades" style="--i:4">Grades</a><a href="/teacher/ds-grades" style="--i:5">DS Grades</a>
      <a href="/teacher/year-results" style="--i:5">Year Results</a>
      <a href="/teacher/productivity" style="--i:6">Productivity</a><a href="/teacher/logins" style="--i:7">Logins</a><a href="/teacher/chats" style="--i:8">Chats</a>
      <a href="/logout" class="logout" style="--i:7">Logout</a>
    </nav>
    <div class="sidebar-footer">
      <em id="sideQuote">Loading...</em>
    </div>
  </aside>
  <div class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>
  <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>

  <main class="main-content">
    <div class="container stagger">
      <div class="page-header">
        <p class="eyebrow">Student Management</p>
        <h1>Students</h1>
        <p>Add, view, and remove students.</p>
      </div>

      <div class="form-card">
        <h3>Add Student</h3>
        <form id="addStudentForm" class="form-row">
          <div>
            <label for="sName">Name</label>
            <input type="text" id="sName" placeholder="Student name" required>
          </div>
          <div>
            <label for="sClass">Class</label>
            <select id="sClass" required></select>
          </div>
          <div>
            <label for="sYear">Academic Year</label>
            <input type="text" id="sYear" placeholder="2026-2027" required>
          </div>
          <button type="submit" class="btn btn-primary">Add Student</button>
        </form>
      </div>

      <div class="filter-bar">
        <div class="filter-group">
          <label for="cf">Class</label>
          <select id="cf"><option value="all">All Classes</option></select>
        </div>
        <div class="filter-group">
          <label for="yf">Year</label>
          <select id="yf"></select>
        </div>
        <button class="btn btn-secondary" id="filterBtn">View</button>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
          <h2 style="margin:0">Student List</h2>
          <button class="btn btn-danger btn-sm" id="deleteAllBtn" style="display:none">Remove All & Reset Grades</button>
        </div>
        <div class="tbl-responsive">
          <table>
            <thead><tr><th>Name</th><th>Class</th><th>Year</th><th>Actions</th></tr></thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/teacher-students.js"></script>
</body>
</html>
