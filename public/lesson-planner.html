<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson Planner - École Officielle Ehmej</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="sidebar-layout">
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="/">
      <span class="brand-mark"><i class="fas fa-school"></i></span>
      <div><strong>École Officielle Ehmej</strong><small>School Tools</small></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-group"><div class="sidebar-group-label">School Tools</div></div>
      <a href="/"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="/attendance.html"><i class="fas fa-clipboard-check"></i> Attendance</a>
      <a href="/lesson-planner.html"><i class="fas fa-book-open"></i> Lesson Planner</a>
      <a href="/seating-chart.html"><i class="fas fa-chair"></i> Seating Chart</a>
      <a href="/schedule.html"><i class="fas fa-calendar-alt"></i> Schedule</a>
      <a href="/productivity.html"><i class="fas fa-tools"></i> Productivity</a>
      <div class="sidebar-group" style="margin-top:.5rem"><div class="sidebar-group-label">Teacher Tools</div></div>
      <a href="/students.html"><i class="fas fa-users"></i> Students</a>
      <a href="/content.html"><i class="fas fa-layer-group"></i> Content</a>
      <a href="/grades.html"><i class="fas fa-star"></i> Grades</a>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebarQuote" style="font-size:.68rem;font-style:italic;color:#b9c4ce;margin-bottom:.5rem;line-height:1.3"></div>
      <a href="/portal" style="color:#cfbd93;text-decoration:none;font-size:.68rem;display:block;margin-bottom:.35rem"><i class="fas fa-external-link-alt"></i> Student Portals</a>
      &copy; 2026 École Officielle Ehmej
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
  <div class="main-content">
    <div class="container">
      <div class="page-hero">
        <p class="eyebrow">Planning</p>
        <h1><i class="fas fa-book-open"></i> Lesson Planner</h1>
        <p>Plan and organize your lessons.</p>
      </div>

      <div class="filter-bar">
        <label for="lpClass">Class:</label>
        <select id="lpClass"><option value="Grade 7">Grade 7</option><option value="Grade 8">Grade 8</option><option value="Grade 9">Grade 9</option></select>
        <label for="lpDate">Date:</label>
        <input type="date" id="lpDate">
        <button class="btn btn-primary" onclick="loadLessons()"><i class="fas fa-search"></i> Load</button>
        <button class="btn btn-success" onclick="showAddLesson()"><i class="fas fa-plus"></i> New Lesson</button>
      </div>

      <div class="card-grid" id="lessonGrid"></div>

      <div id="lessonModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center" onclick="if(event.target===this)hideAddLesson()">
        <div style="background:#fff;border-radius:16px;padding:2rem;width:min(500px,90%);max-height:80vh;overflow-y:auto">
          <h2 style="margin-bottom:1rem" id="modalTitle">New Lesson</h2>
          <input type="hidden" id="lessonId">
          <div style="display:grid;gap:.8rem">
            <input type="text" id="lessonTopic" placeholder="Lesson Topic" style="padding:9px 12px;border:2px solid #e8ddd0;border-radius:8px">
            <textarea id="lessonObjectives" placeholder="Learning Objectives" style="padding:9px 12px;border:2px solid #e8ddd0;border-radius:8px;min-height:60px"></textarea>
            <textarea id="lessonActivities" placeholder="Activities / Exercises" style="padding:9px 12px;border:2px solid #e8ddd0;border-radius:8px;min-height:60px"></textarea>
            <input type="text" id="lessonMaterials" placeholder="Materials / Resources" style="padding:9px 12px;border:2px solid #e8ddd0;border-radius:8px">
            <div style="display:flex;gap:.5rem;margin-top:.5rem">
              <button class="btn btn-success" onclick="saveLesson()"><i class="fas fa-save"></i> Save</button>
              <button class="btn btn-outline" onclick="hideAddLesson()">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/lesson-planner.js"></script>
</body>
</html>
